name: Verify and package Windows
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run audit:source
      - run: npm run build:native
      - run: npm run package:windows
      - name: Portable archive and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $version=(Get-Content package.json -Raw | ConvertFrom-Json).version
          $name="Snowline-Lyrics-$version-win-x64"
          Compress-Archive -LiteralPath "dist/$name" -DestinationPath "dist/$name.zip"
          ((Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash+"  $name.zip") | Set-Content "dist/SHA256.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: snowline-lyrics-windows
          path: |
            dist/*.zip
            dist/SHA256.txt
          if-no-files-found: error
          retention-days: 14
