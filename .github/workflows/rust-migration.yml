name: Rust migration checks
on:
  push:
    branches: [migration/tauri-rust]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Rust timing core tests
        run: cargo test --manifest-path rust/core/Cargo.toml
      - name: Check native desktop preview
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
