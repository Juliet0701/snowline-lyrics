[package]
name = "snowline-desktop"
version = "0.5.3"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snowline-core = { path = "../rust/core" }
windows = { version = "0.62", features = ["Media_Control", "Foundation", "Foundation_Collections", "Win32_System_WinRT"] }

reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
base64 = "0.22"
regex = "1"

httpdate = "1"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 16
strip = true
panic = "abort"
